<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">School Overview</p>
          <h1 id="schoolName">Attendance Dashboard</h1>
        </div>
        <div class="date-pill" id="dateLabel">Today</div>
      </header>

      <main class="dashboard">
        <section class="stats-grid">
          <article class="stat-card accent-blue">
            <span>Total Students</span>
            <strong id="totalStudents">0</strong>
          </article>
          <article class="stat-card accent-green">
            <span>Present</span>
            <strong id="presentCount">0</strong>
          </article>
          <article class="stat-card accent-amber">
            <span>Absent</span>
            <strong id="absentCount">0</strong>
          </article>
          <article class="stat-card accent-purple">
            <span>Attendance Rate</span>
            <strong id="attendanceRate">0%</strong>
          </article>
        </section>

        <section class="panel manager-panel">
          <div class="panel-header">
            <h2 id="formTitle">Add Attendance Record</h2>
          </div>

          <form id="attendanceForm" class="attendance-form">
            <input type="hidden" id="recordId" name="recordId" />

            <div class="field-grid">
              <label class="field">
                <span>Student Name</span>
                <input id="studentName" name="studentName" type="text" placeholder="Enter student name" required />
              </label>

              <label class="field">
                <span>Class</span>
                <select id="studentClass" name="studentClass" required>
                  <option value="">Select class</option>
                </select>
              </label>

              <label class="field">
                <span>Status</span>
                <select id="studentStatus" name="studentStatus" required>
                  <option value="Present">Present</option>
                  <option value="Late">Late</option>
                  <option value="Absent">Absent</option>
                </select>
              </label>

              <label class="field">
                <span>Check In Time</span>
                <input id="checkInTime" name="checkInTime" type="time" />
              </label>
            </div>

            <label class="field full-width">
              <span>Notes</span>
              <textarea id="studentNote" name="studentNote" rows="3" placeholder="Add a note or reason"></textarea>
            </label>

            <div class="form-actions">
              <button type="submit" class="primary-btn" id="submitBtn">Save Record</button>
              <button type="button" class="secondary-btn" id="cancelEditBtn" hidden>Cancel</button>
              <button type="button" class="danger-btn" id="resetBtn">Reset Demo Data</button>
            </div>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel class-panel">
          <div class="panel-header">
            <h2>Class Overview</h2>
            <label class="filter-wrap">
              <span>Filter</span>
              <select id="classFilter">
                <option value="all">All Classes</option>
              </select>
            </label>
          </div>
          <div id="classCards" class="class-grid"></div>
        </section>

        <section class="panel table-panel">
          <div class="panel-header">
            <h2>Daily Attendance Log</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Class</th>
                  <th>Status</th>
                  <th>Check In</th>
                  <th>Notes</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="attendanceTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
